name: CI

on:
    push:
        branches:
            - '**'
    pull_request:
        branches:
            - main

permissions:
    contents: read # to fetch code (actions/checkout)

jobs:
    type-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run tsc
              run: npm run-script type-check

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run ESLint
              run: npm run-script lint

    fmt:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run Prettier
              run: npx prettier --check .

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build app
              run: npm run-script build

    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # one vitest project per vite major plus the CLI, see vitest.config.ts
                project: ['vite6', 'vite7', 'vite8', 'cli']
        name: test (${{ matrix.project }})
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run tests
              run: npm test -- --project ${{ matrix.project }}
