name: CI

on:
    push:
        branches:
            - '**'
    pull_request:
        branches:
            - main

permissions:
    contents: read # to fetch code (actions/checkout)

jobs:
    type-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run tsc
              run: npm run-script type-check

    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run ESLint
              run: npm run-script lint

    fmt:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run Prettier
              run: npx prettier --check .

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Build app
              run: npm run-script build

    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                # 'default' runs against the root `vite` dependency and is the only entry
                # that also exercises the CLI (see test/cli.test.ts and vitest.config.ts)
                vite: ['default', '6', '7', '8']
                include:
                    - vite: '8'
                      experimental: true
        continue-on-error: ${{ matrix.experimental == true }}
        name: test (vite ${{ matrix.vite }})
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run tests
              run: npm test
              env:
                  VITE_VERSION: ${{ matrix.vite != 'default' && matrix.vite || '' }}
